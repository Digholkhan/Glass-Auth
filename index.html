<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Glass Auth</title>
    <meta
      name="description"
      content="Premium glassmorphism authentication interface"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="background-glow glow-a"></div>
    <div class="background-glow glow-b"></div>
    <div class="background-grid"></div>

    <div class="scene" aria-hidden="true">
      <div class="orb orb-1"></div>
      <div class="orb orb-2"></div>
      <div class="orb orb-3"></div>
      <div class="ring ring-1"></div>
      <div class="ring ring-2"></div>
      <div class="cube cube-1"></div>
      <div class="cube cube-2"></div>
      <div class="sphere sphere-1"></div>
      <div class="sphere sphere-2"></div>
      <div class="particles" id="particles"></div>
    </div>

    <main class="auth-shell" id="authShell" data-mode="login">
      <div class="brand-mark" aria-label="Brand logo">
        <span class="brand-core"></span>
      </div>

      <div class="auth-card" id="authCard">
        <div class="glass-sheen" aria-hidden="true"></div>

        <div class="auth-panel-stack" id="authPanelStack">
          <section class="auth-form login-panel active" data-form="login" aria-labelledby="login-title" aria-hidden="false">
            <div class="form-header">
              <p class="eyebrow">Welcome back</p>
              <h1 id="login-title">Sign in to continue your journey</h1>
            </div>

            <form id="loginForm" novalidate>
              <div class="field-group">
                <label for="loginEmail">Email Address</label>
                <div class="input-wrap">
                  <span class="input-icon">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 7.75A2.75 2.75 0 0 1 5.75 5h12.5A2.75 2.75 0 0 1 21 7.75v8.5A2.75 2.75 0 0 1 18.25 19H5.75A2.75 2.75 0 0 1 3 16.25v-8.5Zm2.3-.25 6.7 5.02 6.7-5.02H5.3Zm13.45 9.5a1.25 1.25 0 0 0 1.25-1.25v-6.8l-6.9 5.17a1.25 1.25 0 0 1-1.4 0L4.3 8.95v6.8c0 .69.56 1.25 1.25 1.25h12.9Z"/></svg>
                  </span>
                  <input id="loginEmail" name="email" type="email" placeholder="Enter your email" autocomplete="email" />
                </div>
                <small class="field-error" aria-live="polite"></small>
              </div>

              <div class="field-group">
                <div class="label-row">
                  <label for="loginPassword">Password</label>
                  <a href="#" class="inline-link">Forgot password?</a>
                </div>
                <div class="input-wrap password-wrap">
                  <span class="input-icon">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 10V8.5A5 5 0 0 1 17 8.5V10h.75A2.25 2.25 0 0 1 20 12.25v7.5A2.25 2.25 0 0 1 17.75 22h-11.5A2.25 2.25 0 0 1 4 19.75v-7.5A2.25 2.25 0 0 1 6.25 10H7Zm2 0h6V8.5a3 3 0 1 0-6 0V10Zm-1.25 2.5a1.25 1.25 0 1 0 0 2.5 1.25 1.25 0 0 0 0-2.5Zm7.5 0a1.25 1.25 0 1 0 0 2.5 1.25 1.25 0 0 0 0-2.5Z"/></svg>
                  </span>
                  <input id="loginPassword" name="password" type="password" placeholder="Enter your password" autocomplete="current-password" />
                  <button type="button" class="toggle-password" data-target="loginPassword" aria-label="Show password">Show</button>
                </div>
                <small class="field-error" aria-live="polite"></small>
              </div>

              <div class="meta-row">
                <label class="custom-check">
                  <input type="checkbox" checked />
                  <span>Remember me</span>
                </label>
              </div>

              <button class="primary-btn" type="submit">
                <span class="btn-label">Sign In</span>
              </button>
            </form>

            <div class="separator"><span>or continue with</span></div>

            <div class="social-row">
              <button type="button" class="social-btn">
                <svg viewBox="0 0 48 48" aria-hidden="true"><path fill="#EA4335" d="M24 9.5c3.54 0 6.72 1.22 9.24 3.6l6.87-6.87C35.74 2.49 30.3 0 24 0 14.67 0 6.46 5.38 2.52 13.24l8 6.2C12.17 13.92 17.62 9.5 24 9.5Z"/><path fill="#4285F4" d="M46.5 24.5c0-1.61-.15-3.15-.43-4.64H24v8.78h12.71c-.55 2.96-2.26 5.47-4.82 7.15l7.8 6.06c4.54-4.18 7.81-10.34 7.81-17.35Z"/><path fill="#FBBC05" d="M32.89 35.8c-2.06 1.38-4.68 2.2-8.89 2.2-6.38 0-11.83-4.42-13.77-10.22l-8.02 6.23C5.4 41.39 14.12 48 24 48c7.18 0 13.22-2.37 17.65-6.4l-8.76-6.8Z"/><path fill="#34A853" d="M11.23 27.78A14.92 14.92 0 0 1 10.5 24c0-1.66.29-3.27.81-4.78L3.3 12.99A23.98 23.98 0 0 0 0 24c0 3.87.92 7.52 2.56 10.76l8.67-6.98Z"/><path fill="#EA4335" d="M24 9.5c3.54 0 6.72 1.22 9.24 3.6l6.86-6.86C35.74 2.49 30.3 0 24 0 14.67 0 6.46 5.38 2.52 13.24l8 6.2C12.17 13.92 17.62 9.5 24 9.5Z"/></svg>
                <span>Continue with Google</span>
              </button>
              <button type="button" class="social-btn">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2C6.48 2 2 6.58 2 12.22c0 4.48 2.87 8.28 6.84 9.62.5.1.68-.21.68-.48v-1.7c-2.78.6-3.37-1.34-3.37-1.34-.45-1.15-1.1-1.46-1.1-1.46-.9-.62.07-.61.07-.61 1 .07 1.54 1.03 1.54 1.03.89 1.53 2.34 1.09 2.91.83.09-.65.35-1.09.63-1.34-2.22-.25-4.56-1.11-4.56-4.94 0-1.09.39-1.98 1.03-2.68-.1-.25-.45-1.28.1-2.66 0 0 .84-.27 2.75 1.02A9.48 9.48 0 0 1 12 6.84c.85 0 1.7.11 2.5.33 1.9-1.29 2.74-1.02 2.74-1.02.55 1.38.2 2.41.1 2.66.64.7 1.03 1.59 1.03 2.68 0 3.84-2.34 4.68-4.57 4.93.36.31.68.92.68 1.85v2.75c0 .27.18.58.69.48A10.24 10.24 0 0 0 22 12.22C22 6.58 17.52 2 12 2Z"/></svg>
                <span>Continue with GitHub</span>
              </button>
            </div>

            <p class="switch-line">
              Don’t have an account?
              <button type="button" class="text-link form-toggle" data-target="register">Create Account</button>
            </p>
          </section>

          <section class="auth-form register-panel" data-form="register" aria-labelledby="register-title" aria-hidden="true">
            <div class="form-header">
              <p class="eyebrow">Join the platform</p>
              <h1 id="register-title">Create Your Account</h1>
            </div>

            <form id="registerForm" novalidate>
              <div class="field-group">
                <label for="registerName">Full Name</label>
                <div class="input-wrap">
                  <span class="input-icon">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 12a4 4 0 1 0-4-4 4 4 0 0 0 4 4Zm0 2.25c-4.42 0-8 2.28-8 5.09V20h16v-.66c0-2.81-3.58-5.09-8-5.09Z"/></svg>
                  </span>
                  <input id="registerName" name="name" type="text" placeholder="John Carter" autocomplete="name" />
                </div>
                <small class="field-error" aria-live="polite"></small>
              </div>

              <div class="field-group">
                <label for="registerEmail">Email Address</label>
                <div class="input-wrap">
                  <span class="input-icon">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 7.75A2.75 2.75 0 0 1 5.75 5h12.5A2.75 2.75 0 0 1 21 7.75v8.5A2.75 2.75 0 0 1 18.25 19H5.75A2.75 2.75 0 0 1 3 16.25v-8.5Zm2.3-.25 6.7 5.02 6.7-5.02H5.3Zm13.45 9.5a1.25 1.25 0 0 0 1.25-1.25v-6.8l-6.9 5.17a1.25 1.25 0 0 1-1.4 0L4.3 8.95v6.8c0 .69.56 1.25 1.25 1.25h12.9Z"/></svg>
                  </span>
                  <input id="registerEmail" name="email" type="email" placeholder="you@example.com" autocomplete="email" />
                </div>
                <small class="field-error" aria-live="polite"></small>
              </div>

              <div class="field-group">
                <label for="registerPassword">Password</label>
                <div class="input-wrap password-wrap">
                  <span class="input-icon">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 10V8.5A5 5 0 0 1 17 8.5V10h.75A2.25 2.25 0 0 1 20 12.25v7.5A2.25 2.25 0 0 1 17.75 22h-11.5A2.25 2.25 0 0 1 4 19.75v-7.5A2.25 2.25 0 0 1 6.25 10H7Zm2 0h6V8.5a3 3 0 1 0-6 0V10Zm-1.25 2.5a1.25 1.25 0 1 0 0 2.5 1.25 1.25 0 0 0 0-2.5Zm7.5 0a1.25 1.25 0 1 0 0 2.5 1.25 1.25 0 0 0 0-2.5Z"/></svg>
                  </span>
                  <input id="registerPassword" name="password" type="password" placeholder="Create a password" autocomplete="new-password" />
                  <button type="button" class="toggle-password" data-target="registerPassword" aria-label="Show password">Show</button>
                </div>
                <small class="field-error" aria-live="polite"></small>
                <div class="password-meter" aria-label="Password strength meter">
                  <span class="meter-bar"></span>
                  <span class="meter-bar"></span>
                  <span class="meter-bar"></span>
                  <span class="meter-bar"></span>
                </div>
                <small class="strength-label">Password strength: <span id="strengthText">Weak</span></small>
              </div>

              <div class="field-group">
                <label for="confirmPassword">Confirm Password</label>
                <div class="input-wrap password-wrap">
                  <span class="input-icon">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 10V8.5A5 5 0 0 1 17 8.5V10h.75A2.25 2.25 0 0 1 20 12.25v7.5A2.25 2.25 0 0 1 17.75 22h-11.5A2.25 2.25 0 0 1 4 19.75v-7.5A2.25 2.25 0 0 1 6.25 10H7Zm2 0h6V8.5a3 3 0 1 0-6 0V10Zm-1.25 2.5a1.25 1.25 0 1 0 0 2.5 1.25 1.25 0 0 0 0-2.5Zm7.5 0a1.25 1.25 0 1 0 0 2.5 1.25 1.25 0 0 0 0-2.5Z"/></svg>
                  </span>
                  <input id="confirmPassword" name="confirmPassword" type="password" placeholder="Repeat password" autocomplete="new-password" />
                  <button type="button" class="toggle-password" data-target="confirmPassword" aria-label="Show password">Show</button>
                </div>
                <small class="field-error" aria-live="polite"></small>
              </div>

              <div class="meta-row terms-row">
                <label class="custom-check">
                  <input type="checkbox" name="terms" id="terms" />
                  <span>I agree to the terms and privacy policy.</span>
                </label>
              </div>

              <button class="primary-btn" type="submit">
                <span class="btn-label">Create Account</span>
              </button>
            </form>

            <div class="separator"><span>or continue with</span></div>

            <div class="social-row">
              <button type="button" class="social-btn">
                <svg viewBox="0 0 48 48" aria-hidden="true"><path fill="#EA4335" d="M24 9.5c3.54 0 6.72 1.22 9.24 3.6l6.87-6.87C35.74 2.49 30.3 0 24 0 14.67 0 6.46 5.38 2.52 13.24l8 6.2C12.17 13.92 17.62 9.5 24 9.5Z"/><path fill="#4285F4" d="M46.5 24.5c0-1.61-.15-3.15-.43-4.64H24v8.78h12.71c-.55 2.96-2.26 5.47-4.82 7.15l7.8 6.06c4.54-4.18 7.81-10.34 7.81-17.35Z"/><path fill="#FBBC05" d="M32.89 35.8c-2.06 1.38-4.68 2.2-8.89 2.2-6.38 0-11.83-4.42-13.77-10.22l-8.02 6.23C5.4 41.39 14.12 48 24 48c7.18 0 13.22-2.37 17.65-6.4l-8.76-6.8Z"/><path fill="#34A853" d="M11.23 27.78A14.92 14.92 0 0 1 10.5 24c0-1.66.29-3.27.81-4.78L3.3 12.99A23.98 23.98 0 0 0 0 24c0 3.87.92 7.52 2.56 10.76l8.67-6.98Z"/><path fill="#EA4335" d="M24 9.5c3.54 0 6.72 1.22 9.24 3.6l6.86-6.86C35.74 2.49 30.3 0 24 0 14.67 0 6.46 5.38 2.52 13.24l8 6.2C12.17 13.92 17.62 9.5 24 9.5Z"/></svg>
                <span>Continue with Google</span>
              </button>
              <button type="button" class="social-btn">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2C6.48 2 2 6.58 2 12.22c0 4.48 2.87 8.28 6.84 9.62.5.1.68-.21.68-.48v-1.7c-2.78.6-3.37-1.34-3.37-1.34-.45-1.15-1.1-1.46-1.1-1.46-.9-.62.07-.61.07-.61 1 .07 1.54 1.03 1.54 1.03.89 1.53 2.34 1.09 2.91.83.09-.65.35-1.09.63-1.34-2.22-.25-4.56-1.11-4.56-4.94 0-1.09.39-1.98 1.03-2.68-.1-.25-.45-1.28.1-2.66 0 0 .84-.27 2.75 1.02A9.48 9.48 0 0 1 12 6.84c.85 0 1.7.11 2.5.33 1.9-1.29 2.74-1.02 2.74-1.02.55 1.38.2 2.41.1 2.66.64.7 1.03 1.59 1.03 2.68 0 3.84-2.34 4.68-4.57 4.93.36.31.68.92.68 1.85v2.75c0 .27.18.58.69.48A10.24 10.24 0 0 0 22 12.22C22 6.58 17.52 2 12 2Z"/></svg>
                <span>Continue with GitHub</span>
              </button>
            </div>

            <p class="switch-line">
              Already have an account?
              <button type="button" class="text-link form-toggle" data-target="login">Sign In</button>
            </p>
          </section>
        </div>
      </div>
    </main>

    <script src="script.js"></script>
  </body>
</html>
